apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: confluent-platform
  labels:
    app: kafka
spec:
  clusterIP: None  # Headless service for StatefulSet DNS
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: confluent-platform
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
  selector:
    app: kafka

